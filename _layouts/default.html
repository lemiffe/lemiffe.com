<!DOCTYPE html>
<html lang="en-us">
    {% include head.html %}

    <body class="{{ page.body_class }}">
        {% include sidebar.html %}

        <!-- Wrap is the content to shift when toggling the sidebar. We wrap the
         content to avoid any CSS collisions with our real content. -->
        <div class="wrap">
            <div class="masthead">
                <div class="container">
                    <a class="masthead-brand" href="{{ site.url }}/" title="Home">
                        <img class="wordmark" src="{{ '/assets/brand/logo-white.svg' | absolute_url }}" alt="LEMIFFE" />
                    </a>
                </div>
            </div>

            <div class="container content">{{ content }}</div>
        </div>

        <label for="sidebar-checkbox" class="sidebar-toggle"></label>

        <script src="{{ '/public/js/script.js' | absolute_url }}"></script>
    </body>
</html>
