title: LEMIFFE
tagline: Music, Software & Stories
description: "Lemiffe is a musician & producer from MX, UK and BE making Alt. Rock and Rock Fusion"
url: https://lemiffe.com
baseurl: ""
paginate: 5
paginate_path: /blog/page:num/
permalink: /:title

author:
    name: Lemiffe
    url: https://twitter.com/lemiffe

plugins:
    - jekyll-paginate

# Local-only working directories (gitignored) — keep Jekyll from trying to
# render them. Without this, github-pages' optional-front-matter plugin tries
# to process the planning docs and aborts the build.
exclude:
    - docs
    - .superpowers
    - _tmp_design
    - .jekyll-dev-site
    - _config_dev.yml
    - README.md
    - LICENSE

version: 1.1.0
google_analytics_id: #UA-XXXX-Y
