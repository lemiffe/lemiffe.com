<script

<script>

        targets: ".skull-top",
        translateY: -200,
        delay: 2000,
        duration: 1500,
        easing: "easeInOutQuad",
    });

    anime({
        targets: ".skull",
        scale: [1, 20],
        translateY: 120,
        delay: 2000,
        duration: 1500,
        easing: "easeInOutQuad",

    anime({
        targets: ".skull",
        opacity: [1, 0],
        delay: 3200,
        duration: 4500,

    anime({
        targets: ".navigation-container",
        opacity: [0, 1],
        delay: 2600,
        duration: 1800,
        easing: "easeInOutQuad",
